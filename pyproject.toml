[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-graph-service"
version = "0.4.0"
description = "Deterministic professional graph builder based on vacancies and explicit rules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project team" }]
dependencies = []

[project.scripts]
graph-service = "graph_service.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
