[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-graph-service"
version = "0.9.0"
description = "Professional graph builder for configurable IT professions based on vacancies and explicit rules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project team" }]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
]

[project.scripts]
graph-service = "graph_service.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
